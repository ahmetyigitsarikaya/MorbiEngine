name: Graphics & Rendering Issue
description: Report a Vulkan, DirectX 12, RHI, Render Graph, or DXC Shader Pipeline issue
labels: ["graphics", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        > Please include GPU hardware, driver version, graphics API backend, and whether validation layers / DRED were enabled.

  - type: dropdown
    id: backend
    attributes:
      label: Graphics Backend
      options:
        - Vulkan 1.3 (RHI.Vulkan)
        - DirectX 12 (RHI.DX12)
        - Both Vulkan & DirectX 12
        - Shader Pipeline (DXC / SPIRV-Reflect / DXIL)
        - Render Graph (Morbi.Render)
        - Null Backend (Morbi.RHI)
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: GPU, Driver & SDK Info
      placeholder: |
        - GPU: e.g., NVIDIA RTX 4070 / AMD RX 7800 XT
        - Driver Version:
        - Vulkan SDK / DXC Version:
        - Validation Flags (e.g., --debug, --gpu-gbv):
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description & Reproduction
      description: Describe the visual artifact, validation error, device removal/DRED report, or shader compilation error.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Validation / DRED / DXC Output
      render: text
