name: Build Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  editor-frontend:
    name: Editor Frontend (React / TypeScript / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Editor/Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Editor/Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build frontend bundle
        run: npm run build

  managed-engine:
    name: Managed Scripting (.NET 10)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Morbi.Engine managed assembly
        run: dotnet build Managed/Morbi.Engine/Morbi.Engine.csproj --configuration Release --nologo

# Note on Native C++ CI:
# Full Windows x64 MSVC CMake builds currently depend on local third-party SDKs/libraries
# (DXC, Vulkan SDK, Assimp, SoLoud, WebView2Loader.dll) that are being migrated from legacy
# local paths to self-contained CMake/FetchContent packages (see docs/github-readiness/ADDITIONAL_WORK_PACKAGES.md).
# Once those dependencies are fully self-contained, a windows-latest CMake build job
# (with -DMORBI_BUILD_TESTS=OFF) can be enabled here.
