<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" role="img" aria-label="Morbi Engine Layered Architecture Diagram">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="1160" height="640" rx="12" fill="url(#archBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="42" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700">Morbi Engine — Verified Modular Architecture</text>
  <text x="36" y="64" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">16 C++20 Native Modules · .NET 10 Managed Scripting · React 18 WebView2 Editor · Headless Dedicated Server</text>

  <!-- Layer 1: Application Hosts -->
  <rect x="36" y="88" width="1088" height="86" rx="8" fill="#131C2E" stroke="#334155" />
  <text x="54" y="110" fill="#38BDF8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">APPLICATION HOSTS</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="54" y="122" width="334" height="38" rx="6" fill="#1E293B" stroke="#38BDF8" />
    <text x="221" y="145" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="600">MorbiEditor.exe (Thin Host + React 18 RCDATA)</text>

    <rect x="412" y="122" width="334" height="38" rx="6" fill="#1E293B" stroke="#6366F1" />
    <text x="579" y="145" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="600">LauncherTemplate (Standalone Game EXE)</text>

    <rect x="770" y="122" width="334" height="38" rx="6" fill="#1E293B" stroke="#10B981" />
    <text x="937" y="145" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="600">MorbiServer.exe (Headless Dedicated Server)</text>
  </g>

  <!-- Layer 2: Runtime & Simulation -->
  <rect x="36" y="192" width="1088" height="86" rx="8" fill="#131C2E" stroke="#334155" />
  <text x="54" y="214" fill="#A5B4FC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">RUNTIME &amp; SIMULATION LAYER</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="54" y="226" width="516" height="38" rx="6" fill="#1E293B" stroke="#818CF8" />
    <text x="312" y="249" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="600">Morbi.Runtime (SHARED — EngineRuntime, ProjectBuilder)</text>

    <rect x="594" y="226" width="510" height="38" rx="6" fill="#1E293B" stroke="#10B981" />
    <text x="849" y="249" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="600">Morbi.Simulation (STATIC — SimulationSession, SceneReplicationBridge)</text>
  </g>

  <!-- Layer 3: Gameplay, Scripting, UI & Domain Subsystems -->
  <rect x="36" y="296" width="1088" height="94" rx="8" fill="#131C2E" stroke="#334155" />
  <text x="54" y="318" fill="#34D399" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">DOMAIN SUBSYSTEMS</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="54" y="330" width="142" height="44" rx="6" fill="#1E293B" stroke="#475569" />
    <text x="125" y="350" text-anchor="middle" fill="#F8FAFC">Morbi.Scene</text>
    <text x="125" y="366" text-anchor="middle" fill="#94A3B8" font-size="10">Sparse-Set ECS</text>

    <rect x="208" y="330" width="142" height="44" rx="6" fill="#1E293B" stroke="#475569" />
    <text x="279" y="350" text-anchor="middle" fill="#F8FAFC">Morbi.Physics</text>
    <text x="279" y="366" text-anchor="middle" fill="#94A3B8" font-size="10">Jolt v5.2.0</text>

    <rect x="362" y="330" width="132" height="44" rx="6" fill="#1E293B" stroke="#475569" />
    <text x="428" y="350" text-anchor="middle" fill="#F8FAFC">Morbi.Audio</text>
    <text x="428" y="366" text-anchor="middle" fill="#94A3B8" font-size="10">SoLoud 3D</text>

    <rect x="506" y="330" width="148" height="44" rx="6" fill="#1E293B" stroke="#475569" />
    <text x="580" y="350" text-anchor="middle" fill="#F8FAFC">Morbi.Network</text>
    <text x="580" y="366" text-anchor="middle" fill="#94A3B8" font-size="10">ENet + libsodium</text>

    <rect x="666" y="330" width="144" height="44" rx="6" fill="#1E293B" stroke="#475569" />
    <text x="738" y="350" text-anchor="middle" fill="#F8FAFC">Morbi.Asset</text>
    <text x="738" y="366" text-anchor="middle" fill="#94A3B8" font-size="10">Assimp / Anim / WIC</text>

    <rect x="822" y="330" width="138" height="44" rx="6" fill="#1E293B" stroke="#475569" />
    <text x="891" y="350" text-anchor="middle" fill="#F8FAFC">Morbi.Script</text>
    <text x="891" y="366" text-anchor="middle" fill="#94A3B8" font-size="10">.NET 10 + Roslyn</text>

    <rect x="972" y="330" width="132" height="44" rx="6" fill="#1E293B" stroke="#475569" />
    <text x="1038" y="350" text-anchor="middle" fill="#F8FAFC">Morbi.UI</text>
    <text x="1038" y="366" text-anchor="middle" fill="#94A3B8" font-size="10">WebView2 / HUD</text>
  </g>

  <!-- Layer 4: Graphics, RHI & Shaders -->
  <rect x="36" y="408" width="1088" height="94" rx="8" fill="#131C2E" stroke="#334155" />
  <text x="54" y="430" fill="#F59E0B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">GRAPHICS, RHI &amp; SHADER INFRASTRUCTURE</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="54" y="442" width="198" height="44" rx="6" fill="#1E293B" stroke="#F59E0B" />
    <text x="153" y="462" text-anchor="middle" fill="#F8FAFC">Morbi.Render</text>
    <text x="153" y="478" text-anchor="middle" fill="#94A3B8" font-size="10">RenderGraph · RHIFactory</text>

    <rect x="268" y="442" width="204" height="44" rx="6" fill="#1E293B" stroke="#F59E0B" />
    <text x="370" y="462" text-anchor="middle" fill="#F8FAFC">Morbi.Shader</text>
    <text x="370" y="478" text-anchor="middle" fill="#94A3B8" font-size="10">In-Process DXC · Reflection · V3 Cache</text>

    <rect x="488" y="442" width="194" height="44" rx="6" fill="#1E293B" stroke="#F59E0B" />
    <text x="585" y="462" text-anchor="middle" fill="#F8FAFC">Morbi.RHI</text>
    <text x="585" y="478" text-anchor="middle" fill="#94A3B8" font-size="10">IDevice · PipelineLayout · Null</text>

    <rect x="698" y="442" width="196" height="44" rx="6" fill="#1E293B" stroke="#38BDF8" />
    <text x="796" y="462" text-anchor="middle" fill="#F8FAFC">Morbi.RHI.Vulkan</text>
    <text x="796" y="478" text-anchor="middle" fill="#94A3B8" font-size="10">Vulkan 1.3 · Bindless · Slabs</text>

    <rect x="910" y="442" width="194" height="44" rx="6" fill="#1E293B" stroke="#38BDF8" />
    <text x="1007" y="462" text-anchor="middle" fill="#F8FAFC">Morbi.RHI.DX12</text>
    <text x="1007" y="478" text-anchor="middle" fill="#94A3B8" font-size="10">D3D12 · DRED · Root Sigs</text>
  </g>

  <!-- Layer 5: Foundation -->
  <rect x="36" y="520" width="1088" height="88" rx="8" fill="#131C2E" stroke="#334155" />
  <text x="54" y="542" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">FOUNDATION LAYER</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="54" y="554" width="336" height="38" rx="6" fill="#1E293B" stroke="#64748B" />
    <text x="222" y="577" text-anchor="middle" fill="#F8FAFC">Morbi.Core (TaskScheduler · SSE2 Math · Handles · CrashHandler)</text>

    <rect x="412" y="554" width="336" height="38" rx="6" fill="#1E293B" stroke="#64748B" />
    <text x="580" y="577" text-anchor="middle" fill="#F8FAFC">Morbi.IO (PathService VFS · FileWatcher · MorbiPak .mpak)</text>

    <rect x="770" y="554" width="334" height="38" rx="6" fill="#1E293B" stroke="#64748B" />
    <text x="937" y="577" text-anchor="middle" fill="#F8FAFC">Morbi.Platform (SDL3 Window · InputState · Win32 HWND)</text>
  </g>
</svg>
